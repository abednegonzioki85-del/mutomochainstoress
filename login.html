<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutomo Chain Stores · Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        /* ===== COLORS: GREEN, ORANGE, BLUE, WHITE ===== */
        :root {
            --green: #00c853;
            --green-dark: #009624;
            --green-light: #69f0ae;
            --green-glow: rgba(0, 200, 83, 0.3);
            
            --orange: #ff6d00;
            --orange-dark: #e65100;
            --orange-light: #ffab40;
            --orange-glow: rgba(255, 109, 0, 0.3);
            
            --blue: #2979ff;
            --blue-dark: #0d47a1;
            --blue-light: #82b1ff;
            --blue-glow: rgba(41, 121, 255, 0.3);
            
            --white: #ffffff;
            --white-muted: rgba(255, 255, 255, 0.6);
            --white-dim: rgba(255, 255, 255, 0.25);
            
            --bg-dark: #0a0e17;
            --bg-card: rgba(10, 14, 23, 0.92);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-dark);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== BACKGROUND ===== */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 200, 83, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(41, 121, 255, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 109, 0, 0.08) 0%, transparent 50%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
        }

        .orb-1 { width: 600px; height: 600px; background: rgba(0, 200, 83, 0.15); top: -20%; left: -20%; }
        .orb-2 { width: 500px; height: 500px; background: rgba(41, 121, 255, 0.12); bottom: -20%; right: -20%; }
        .orb-3 { width: 400px; height: 400px; background: rgba(255, 109, 0, 0.10); top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ===== LOGIN WRAPPER ===== */
        .login-wrapper {
            max-width: 440px;
            margin: 0 auto;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ===== LOGIN CARD ===== */
        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 32px;
            padding: 48px 44px 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 40px 120px rgba(0, 0, 0, 0.8),
                0 0 80px rgba(0, 200, 83, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
        }

        /* ===== BORDER: GREEN + ORANGE + BLUE ===== */
        .login-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 33px;
            padding: 2px;
            background: conic-gradient(
                from 0deg,
                var(--green),
                var(--orange),
                var(--blue),
                var(--green)
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.8;
        }

        /* ===== TOP ACCENT BAR ===== */
        .login-card .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--green), var(--orange), var(--blue), var(--green));
            border-radius: 32px 32px 0 0;
            box-shadow: 0 0 40px var(--green-glow);
        }

        /* ===== BRAND ===== */
        .login-brand {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .login-brand .logo-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 84px;
            background: linear-gradient(135deg, var(--green), var(--blue));
            border-radius: 26px;
            color: var(--white);
            font-size: 2.6rem;
            box-shadow: 
                0 20px 60px rgba(0, 200, 83, 0.25),
                0 0 80px rgba(0, 200, 83, 0.08);
            margin-bottom: 20px;
            position: relative;
        }

        .login-brand .logo-wrapper::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 29px;
            background: linear-gradient(135deg, var(--green), var(--blue));
            opacity: 0.3;
            filter: blur(20px);
            z-index: -1;
        }

        .login-brand h1 {
            font-weight: 900;
            font-size: 2.1rem;
            color: var(--white);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .login-brand h1 .highlight-green {
            color: var(--green);
        }

        .login-brand .tagline {
            color: var(--white-muted);
            font-size: 0.9rem;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .login-brand .tagline i {
            color: var(--green);
        }

        /* ===== ROLE SELECTOR - BULLET STYLE ===== */
        .role-selector {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .role-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 4px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--white-muted);
            transition: all 0.3s ease;
            position: relative;
        }

        .role-option::before {
            content: '•';
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--white-dim);
            transition: all 0.3s ease;
        }

        .role-option:hover {
            color: var(--white);
        }

        .role-option.active {
            color: var(--white);
        }

        .role-option.active::before {
            color: var(--green);
        }

        .role-option .role-icon {
            margin-right: 4px;
        }

        .role-option.active .role-icon {
            color: var(--green);
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--white-muted);
            margin-bottom: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .form-group label i {
            color: var(--orange);
            margin-right: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--green);
            background: rgba(0, 200, 83, 0.05);
            box-shadow: 0 0 0 5px rgba(0, 200, 83, 0.08);
        }

        .input-wrapper .input-icon {
            padding: 0 0 0 16px;
            color: var(--white-dim);
            font-size: 1rem;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--green);
        }

        .input-wrapper input {
            border: none;
            padding: 15px 16px 15px 12px;
            width: 100%;
            background: transparent;
            outline: none;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--white);
        }

        .input-wrapper input::placeholder {
            font-weight: 400;
            color: var(--white-dim);
        }

        .input-wrapper input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px rgba(255, 255, 255, 0.03) inset !important;
            -webkit-text-fill-color: var(--white) !important;
        }

        .input-wrapper .toggle-password {
            padding: 0 16px 0 0;
            color: var(--white-dim);
            cursor: pointer;
            font-size: 0.95rem;
            background: none;
            border: none;
            transition: all 0.3s ease;
        }

        .input-wrapper .toggle-password:hover {
            color: var(--green);
        }

        /* ===== FORM OPTIONS - BULLET STYLE ===== */
        .form-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .form-options .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--white-muted);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .form-options .option-item::before {
            content: '•';
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--white-dim);
            transition: all 0.3s ease;
        }

        .form-options .option-item:hover {
            color: var(--white);
        }

        .form-options .option-item:hover::before {
            color: var(--green);
        }

        /* Remember me checkbox */
        .form-options .option-item.remember-me {
            cursor: pointer;
        }

        .form-options .option-item.remember-me::before {
            content: '';
            width: 18px;
            height: 18px;
            border: 2px solid var(--white-dim);
            border-radius: 4px;
            display: inline-block;
            flex-shrink: 0;
            transition: all 0.3s ease;
            background: transparent;
        }

        .form-options .option-item.remember-me:hover::before {
            border-color: var(--green);
        }

        .form-options .option-item.remember-me input[type="checkbox"] {
            display: none;
        }

        .form-options .option-item.remember-me .checkmark {
            display: none;
            position: absolute;
            left: 3px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--green);
            font-size: 0.7rem;
        }

        .form-options .option-item.remember-me {
            position: relative;
        }

        .form-options .option-item.remember-me input[type="checkbox"]:checked + .checkmark {
            display: inline-block;
        }

        .form-options .option-item.forgot-link {
            background: none;
            border: none;
            padding: 0;
            font-size: 0.85rem;
            color: var(--white-muted);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-options .option-item.forgot-link:hover {
            color: var(--blue);
        }

        .form-options .option-item.forgot-link:hover::before {
            color: var(--blue);
        }

        /* ===== MESSAGES ===== */
        .login-error {
            background: rgba(255, 23, 68, 0.10);
            border: 2px solid rgba(255, 23, 68, 0.25);
            color: #ff1744;
            padding: 13px 18px;
            border-radius: 14px;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .login-error.show {
            display: flex;
        }

        .login-error i {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .login-success {
            display: none;
            background: rgba(0, 200, 83, 0.08);
            border: 2px solid rgba(0, 200, 83, 0.25);
            color: var(--green-light);
            padding: 13px 18px;
            border-radius: 14px;
            font-size: 0.85rem;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .login-success.show {
            display: flex;
        }

        .login-success i {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* ===== LOGIN BUTTON ===== */
        .btn-login {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1rem;
            color: var(--white);
            background: linear-gradient(135deg, var(--green), var(--blue));
            cursor: pointer;
            box-shadow: 
                0 4px 30px rgba(0, 200, 83, 0.3),
                0 0 60px rgba(0, 200, 83, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            z-index: 1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.15), 
                transparent
            );
            transition: all 0.6s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            box-shadow: 
                0 6px 40px rgba(0, 200, 83, 0.4),
                0 0 80px rgba(0, 200, 83, 0.1),
                0 0 120px rgba(41, 121, 255, 0.05);
            transform: translateY(-2px);
            background: linear-gradient(135deg, var(--green-light), var(--blue));
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        .btn-login .btn-text {
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-login .btn-icon {
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .btn-login:hover .btn-icon {
            transform: translateX(4px);
        }

        /* Loading */
        .btn-login.loading {
            opacity: 0.8;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-login .spinner {
            display: none;
        }

        .btn-login.loading .spinner {
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }

        .btn-login.loading .btn-text {
            opacity: 0.7;
        }

        .btn-login.loading .btn-icon {
            display: none;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== FOOTER - BULLET STYLE ===== */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 1;
        }

        .login-footer .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--white-dim);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            flex-wrap: wrap;
        }

        .login-footer .security-badge .badge-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .login-footer .security-badge .badge-item::before {
            content: '•';
            font-size: 1.2rem;
            font-weight: 900;
        }

        .login-footer .security-badge .badge-green i,
        .login-footer .security-badge .badge-green::before { color: var(--green); }
        
        .login-footer .security-badge .badge-orange i,
        .login-footer .security-badge .badge-orange::before { color: var(--orange); }
        
        .login-footer .security-badge .badge-blue i,
        .login-footer .security-badge .badge-blue::before { color: var(--blue); }

        .login-footer .security-badge .badge-item i {
            font-size: 0.8rem;
        }

        .login-footer .security-badge .divider {
            color: rgba(255, 255, 255, 0.06);
        }

        .login-footer .version {
            color: var(--white-dim);
            font-size: 0.65rem;
            margin-top: 10px;
            letter-spacing: 0.3px;
        }

        /* ===== POWERED BY ===== */
        .powered-by {
            text-align: center;
            margin-top: 20px;
            position: relative;
            z-index: 1;
        }

        .powered-by .tech-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--white-dim);
            font-size: 0.6rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .powered-by .tech-badge:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .powered-by .tech-badge i {
            font-size: 0.7rem;
        }

        .powered-by .tech-badge .dot-green { color: var(--green); }
        .powered-by .tech-badge .dot-orange { color: var(--orange); }
        .powered-by .tech-badge .dot-blue { color: var(--blue); }

        .powered-by .tech-badge .dot {
            font-size: 0.3rem;
            color: var(--white-dim);
        }

        .powered-by .tech-badge strong {
            color: var(--white-muted);
            font-weight: 700;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .login-card {
                padding: 36px 28px 32px;
                border-radius: 26px;
            }

            .login-brand .logo-wrapper {
                width: 72px;
                height: 72px;
                font-size: 2.2rem;
            }

            .login-brand h1 {
                font-size: 1.7rem;
            }

            .input-wrapper input {
                padding: 13px 14px 13px 12px;
                font-size: 0.9rem;
            }

            .btn-login {
                padding: 16px;
                font-size: 0.95rem;
            }

            .role-selector {
                gap: 16px;
                flex-wrap: wrap;
            }

            .role-option {
                font-size: 0.8rem;
            }

            .form-options {
                gap: 8px;
            }

            .login-footer .security-badge {
                gap: 8px;
            }

            .login-footer .security-badge .divider {
                display: none;
            }
        }

        @media (max-width: 380px) {
            .login-card {
                padding: 28px 20px 24px;
                border-radius: 22px;
            }

            .login-brand .logo-wrapper {
                width: 62px;
                height: 62px;
                font-size: 1.8rem;
            }

            .login-brand h1 {
                font-size: 1.4rem;
            }

            .role-selector {
                gap: 12px;
            }

            .role-option {
                font-size: 0.7rem;
            }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 200, 83, 0.3); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 200, 83, 0.5); }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg-container">
        <div class="bg-gradient"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- ===== LOGIN ===== -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="accent-bar"></div>

            <!-- Brand -->
            <div class="login-brand">
                <div class="logo-wrapper">
                    <i class="fas fa-store-alt"></i>
                </div>
                <h1>
                    Mutomo Chain 
                    <span class="highlight-green">Stores</span>
                </h1>
                <p class="tagline">
                    <i class="fas fa-shield-alt"></i> Secure Point of Sale System
                </p>
            </div>

            <!-- ROLE SELECTOR - BULLET STYLE -->
            <div class="role-selector" id="roleSelector">
                <button class="role-option active" data-role="admin" onclick="selectRole('admin')">
                    <i class="fas fa-user-shield role-icon"></i> Administrator
                </button>
                <button class="role-option" data-role="sales" onclick="selectRole('sales')">
                    <i class="fas fa-user-tie role-icon"></i> Sales Person
                </button>
            </div>

            <form id="loginForm" autocomplete="off">

                <!-- USERNAME -->
                <div class="form-group">
                    <label for="loginUsername">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" id="loginUsername" placeholder="Enter your username" autocomplete="off" required>
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="off" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- OPTIONS - BULLET STYLE -->
                <div class="form-options">
                    <label class="option-item remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"><i class="fas fa-check"></i></span>
                        Remember me
                    </label>
                    <button type="button" class="option-item forgot-link" onclick="showForgotPassword()">
                        Forgot your password?
                    </button>
                </div>

                <!-- MESSAGES -->
                <div class="login-error" id="loginError">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>Invalid username or password. Please try again.</span>
                </div>

                <div class="login-success" id="loginSuccess">
                    <i class="fas fa-check-circle"></i>
                    <span>Login successful! Redirecting...</span>
                </div>

                <!-- LOGIN BUTTON -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">Login</span>
                    <i class="fas fa-arrow-right btn-icon"></i>
                    <i class="fas fa-spinner spinner"></i>
                </button>
            </form>

            <!-- FOOTER - BULLET STYLE -->
            <div class="login-footer">
                <div class="security-badge">
                    <span class="badge-item badge-green">
                        <i class="fas fa-check-circle"></i> Secured connection
                    </span>
                    <span class="divider">|</span>
                    <span class="badge-item badge-orange">
                        <i class="fas fa-lock"></i> Encrypted
                    </span>
                    <span class="divider">|</span>
                    <span class="badge-item badge-blue">
                        <i class="fas fa-shield-alt"></i> Protected
                    </span>
                </div>
                <div class="version">&copy; 2026 Mutomo Chain Stores</div>
            </div>
        </div>

        <!-- POWERED BY -->
        <div class="powered-by">
            <span class="tech-badge">
                <i class="fas fa-code dot-green"></i>
                <span class="dot">•</span>
                Powered by <strong>AJ Tech</strong>
                <span class="dot">•</span>
                <i class="fas fa-fire dot-orange"></i>
                <span class="dot">•</span>
                <i class="fas fa-cloud dot-blue"></i>
            </span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ===== NO AUTO-REDIRECT ON LOGIN PAGE =====
            // This page should ALWAYS show the login form
            // Remove any automatic redirect logic

            const USERS = {
                'admin': { password: 'admin123', role: 'Admin', name: 'James' },
                'alice': { password: 'alice123', role: 'Admin', name: 'Alice' },
                'brian': { password: 'brian123', role: 'Sales', name: 'Brian' },
                'cathy': { password: 'cathy123', role: 'Sales', name: 'Cathy' }
            };

            let selectedRole = 'admin';

            window.selectRole = function(role) {
                selectedRole = role;
                const options = document.querySelectorAll('.role-option');
                options.forEach(opt => {
                    opt.classList.remove('active');
                    if (opt.dataset.role === role) {
                        opt.classList.add('active');
                    }
                });
            };

            window.showForgotPassword = function() {
                const error = document.getElementById('loginError');
                error.querySelector('span').textContent = '🔑 Please contact your system administrator to reset your password.';
                error.classList.add('show');
                setTimeout(() => error.classList.remove('show'), 4000);
            };

            // Toggle password visibility
            let passwordVisible = false;
            document.getElementById('togglePassword').addEventListener('click', function() {
                passwordVisible = !passwordVisible;
                const input = document.getElementById('loginPassword');
                input.type = passwordVisible ? 'text' : 'password';
                this.querySelector('i').className = passwordVisible ? 'fas fa-eye-slash' : 'fas fa-eye';
            });

            // Remember me
            const rememberMe = document.getElementById('rememberMe');
            const savedUsername = localStorage.getItem('mutomo_remember_username');
            if (savedUsername) {
                document.getElementById('loginUsername').value = savedUsername;
                rememberMe.checked = true;
            }

            // Form submission
            const loginForm = document.getElementById('loginForm');
            const loginUsername = document.getElementById('loginUsername');
            const loginPassword = document.getElementById('loginPassword');
            const loginError = document.getElementById('loginError');
            const loginSuccess = document.getElementById('loginSuccess');
            const loginBtn = document.getElementById('loginBtn');

            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = loginUsername.value.trim();
                const password = loginPassword.value.trim();

                loginBtn.classList.add('loading');
                loginBtn.querySelector('.btn-text').textContent = 'Authenticating...';

                setTimeout(() => {
                    const user = USERS[username.toLowerCase()];

                    if (user && user.password === password) {
                        const userRole = user.role.toLowerCase();
                        if (userRole !== selectedRole) {
                            loginError.querySelector('span').textContent =
                                `⛔ This account is not a ${selectedRole === 'admin' ? 'Administrator' : 'Sales Person'} account. Please select the correct role.`;
                            loginError.classList.add('show');
                            loginSuccess.classList.remove('show');
                            loginBtn.classList.remove('loading');
                            loginBtn.querySelector('.btn-text').textContent = 'Login';
                            setTimeout(() => loginError.classList.remove('show'), 4000);
                            return;
                        }

                        if (rememberMe.checked) {
                            localStorage.setItem('mutomo_remember_username', username);
                        } else {
                            localStorage.removeItem('mutomo_remember_username');
                        }

                        loginError.classList.remove('show');
                        loginSuccess.classList.add('show');
                        
                        // ===== STORE USER SESSION =====
                        sessionStorage.setItem('currentUser', JSON.stringify({ username, ...user }));
                        
                        // ===== REDIRECT BASED ON ROLE =====
                        if (user.role === 'Admin') {
                            loginSuccess.querySelector('span').textContent = `✅ Welcome Admin, ${user.name}! Redirecting to Admin Dashboard...`;
                            setTimeout(() => {
                                window.location.href = 'dashboard-admin.html';
                            }, 1500);
                        } else {
                            loginSuccess.querySelector('span').textContent = `✅ Welcome Sales Person, ${user.name}! Redirecting to Sales Dashboard...`;
                            setTimeout(() => {
                                window.location.href = 'dashboard-sales.html';
                            }, 1500);
                        }
                        
                        loginBtn.classList.remove('loading');
                        loginBtn.querySelector('.btn-text').textContent = 'Login';
                    } else {
                        loginError.querySelector('span').textContent = '❌ Invalid username or password. Please try again.';
                        loginError.classList.add('show');
                        loginSuccess.classList.remove('show');
                        loginBtn.classList.remove('loading');
                        loginBtn.querySelector('.btn-text').textContent = 'Login';
                        setTimeout(() => loginError.classList.remove('show'), 4000);
                    }
                }, 800);
            });

            // ===== DO NOT AUTO-REDIRECT ON LOGIN PAGE =====
            // Remove the session check that redirects to dashboard

            // Enter key shortcuts
            loginPassword.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
            });

            loginUsername.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') loginPassword.focus();
            });

            console.log('🔐 Login page loaded - waiting for user login');
        })();
    </script>

</body>
</html>
