<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutomo Chain Stores · Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        /* ===== COLORS: BLUE, GREEN, ORANGE, WHITE ===== */
        :root {
            --blue: #2979ff;
            --blue-dark: #0d47a1;
            --blue-light: #82b1ff;
            --blue-glow: rgba(41, 121, 255, 0.3);
            
            --green: #00c853;
            --green-dark: #009624;
            --green-light: #69f0ae;
            --green-glow: rgba(0, 200, 83, 0.3);
            
            --orange: #ff6d00;
            --orange-dark: #e65100;
            --orange-light: #ffab40;
            --orange-glow: rgba(255, 109, 0, 0.3);
            
            --white: #ffffff;
            --white-muted: rgba(255, 255, 255, 0.6);
            --white-dim: rgba(255, 255, 255, 0.25);
            
            --bg-dark: #0a0e17;
            --bg-card: rgba(10, 14, 23, 0.92);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-dark);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== BACKGROUND ===== */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(41, 121, 255, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 200, 83, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 109, 0, 0.08) 0%, transparent 50%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
        }

        .orb-1 { width: 600px; height: 600px; background: rgba(41, 121, 255, 0.15); top: -20%; left: -20%; }
        .orb-2 { width: 500px; height: 500px; background: rgba(0, 200, 83, 0.12); bottom: -20%; right: -20%; }
        .orb-3 { width: 400px; height: 400px; background: rgba(255, 109, 0, 0.10); top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ===== LOGIN WRAPPER ===== */
        .login-wrapper {
            max-width: 440px;
            margin: 0 auto;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ===== LOGIN CARD ===== */
        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 32px;
            padding: 48px 44px 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 40px 120px rgba(0, 0, 0, 0.8),
                0 0 80px rgba(41, 121, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 33px;
            padding: 2px;
            background: conic-gradient(
                from 0deg,
                var(--blue),
                var(--green),
                var(--orange),
                var(--blue)
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.8;
        }

        .login-card .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--blue), var(--green), var(--orange), var(--blue));
            border-radius: 32px 32px 0 0;
            box-shadow: 0 0 40px var(--blue-glow);
        }

        /* ===== BRAND ===== */
        .login-brand {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .login-brand .logo-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 84px;
            background: linear-gradient(135deg, var(--blue), var(--green));
            border-radius: 26px;
            color: var(--white);
            font-size: 2.6rem;
            box-shadow: 
                0 20px 60px rgba(41, 121, 255, 0.25),
                0 0 80px rgba(41, 121, 255, 0.08);
            margin-bottom: 20px;
            position: relative;
        }

        .login-brand .logo-wrapper::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 29px;
            background: linear-gradient(135deg, var(--blue), var(--green));
            opacity: 0.3;
            filter: blur(20px);
            z-index: -1;
        }

        .login-brand h1 {
            font-weight: 900;
            font-size: 2.1rem;
            color: var(--white);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .login-brand h1 .highlight-blue {
            color: var(--blue);
        }

        .login-brand .tagline {
            color: var(--white-muted);
            font-size: 0.9rem;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .login-brand .tagline i {
            color: var(--blue);
        }

        /* ============================================
                   DROPDOWN SELECT - ROLE
               ============================================ */
        .role-dropdown-section {
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .role-dropdown-section label {
            display: block;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--white-muted);
            margin-bottom: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .role-dropdown-section label i {
            color: var(--orange);
            margin-right: 8px;
        }

        .role-select-wrapper {
            position: relative;
        }

        .role-select-wrapper::after {
            content: '\f0d7';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--blue);
            font-size: 1rem;
            pointer-events: none;
        }

        .role-select-dropdown {
            width: 100%;
            padding: 15px 45px 15px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(41, 121, 255, 0.15);
            border-radius: 14px;
            color: var(--white);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            transition: all 0.3s ease;
        }

        .role-select-dropdown:hover {
            border-color: rgba(41, 121, 255, 0.3);
        }

        .role-select-dropdown:focus {
            border-color: var(--blue);
            background: rgba(41, 121, 255, 0.06);
            box-shadow: 0 0 0 5px rgba(41, 121, 255, 0.08);
        }

        .role-select-dropdown option {
            background: #1a1a2e;
            color: var(--white);
            padding: 12px 16px;
            font-weight: 500;
        }

        .role-select-dropdown option:checked {
            background: linear-gradient(135deg, var(--blue), var(--green));
            color: var(--white);
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--white-muted);
            margin-bottom: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .form-group label i {
            color: var(--orange);
            margin-right: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--blue);
            background: rgba(41, 121, 255, 0.05);
            box-shadow: 0 0 0 5px rgba(41, 121, 255, 0.08);
        }

        .input-wrapper .input-icon {
            padding: 0 0 0 16px;
            color: var(--white-dim);
            font-size: 1rem;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--blue);
        }

        .input-wrapper input {
            border: none;
            padding: 15px 16px 15px 12px;
            width: 100%;
            background: transparent;
            outline: none;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--white);
        }

        .input-wrapper input::placeholder {
            font-weight: 400;
            color: var(--white-dim);
        }

        .input-wrapper input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px rgba(255, 255, 255, 0.03) inset !important;
            -webkit-text-fill-color: var(--white) !important;
        }

        .input-wrapper .toggle-password {
            padding: 0 16px 0 0;
            color: var(--white-dim);
            cursor: pointer;
            font-size: 0.95rem;
            background: none;
            border: none;
            transition: all 0.3s ease;
        }

        .input-wrapper .toggle-password:hover {
            color: var(--blue);
        }

        /* ===== FORM OPTIONS ===== */
        .form-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .form-options .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--white-muted);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .form-options .option-item::before {
            content: '•';
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--white-dim);
            transition: all 0.3s ease;
        }

        .form-options .option-item:hover {
            color: var(--white);
        }

        .form-options .option-item:hover::before {
            color: var(--blue);
        }

        .form-options .option-item.remember-me {
            cursor: pointer;
        }

        .form-options .option-item.remember-me::before {
            content: '';
            width: 18px;
            height: 18px;
            border: 2px solid var(--white-dim);
            border-radius: 4px;
            display: inline-block;
            flex-shrink: 0;
            transition: all 0.3s ease;
            background: transparent;
        }

        .form-options .option-item.remember-me:hover::before {
            border-color: var(--blue);
        }

        .form-options .option-item.remember-me input[type="checkbox"] {
            display: none;
        }

        .form-options .option-item.remember-me .checkmark {
            display: none;
            position: absolute;
            left: 3px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--blue);
            font-size: 0.7rem;
        }

        .form-options .option-item.remember-me {
            position: relative;
        }

        .form-options .option-item.remember-me input[type="checkbox"]:checked + .checkmark {
            display: inline-block;
        }

        .form-options .option-item.forgot-link {
            background: none;
            border: none;
            padding: 0;
            font-size: 0.85rem;
            color: var(--white-muted);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-options .option-item.forgot-link:hover {
            color: var(--green);
        }

        .form-options .option-item.forgot-link:hover::before {
            color: var(--green);
        }

        /* ===== LOGIN BUTTON ===== */
        .btn-login {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1rem;
            color: var(--white);
            background: linear-gradient(135deg, var(--blue), var(--green));
            cursor: pointer;
            box-shadow: 
                0 4px 30px rgba(41, 121, 255, 0.3),
                0 0 60px rgba(41, 121, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            z-index: 1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.15), 
                transparent
            );
            transition: all 0.6s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            box-shadow: 
                0 6px 40px rgba(41, 121, 255, 0.4),
                0 0 80px rgba(41, 121, 255, 0.1),
                0 0 120px rgba(0, 200, 83, 0.05);
            transform: translateY(-2px);
            background: linear-gradient(135deg, var(--blue-light), var(--green));
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        .btn-login .btn-text {
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-login .btn-icon {
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .btn-login:hover .btn-icon {
            transform: translateX(4px);
        }

        .btn-login.loading {
            opacity: 0.8;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-login .spinner {
            display: none;
        }

        .btn-login.loading .spinner {
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }

        .btn-login.loading .btn-text {
            opacity: 0.7;
        }

        .btn-login.loading .btn-icon {
            display: none;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== FOOTER ===== */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 1;
        }

        .login-footer .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--white-dim);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            flex-wrap: wrap;
        }

        .login-footer .security-badge .badge-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .login-footer .security-badge .badge-item::before {
            content: '•';
            font-size: 1.2rem;
            font-weight: 900;
        }

        .login-footer .security-badge .badge-blue i,
        .login-footer .security-badge .badge-blue::before { color: var(--blue); }
        
        .login-footer .security-badge .badge-green i,
        .login-footer .security-badge .badge-green::before { color: var(--green); }
        
        .login-footer .security-badge .badge-orange i,
        .login-footer .security-badge .badge-orange::before { color: var(--orange); }

        .login-footer .security-badge .badge-item i {
            font-size: 0.8rem;
        }

        .login-footer .security-badge .divider {
            color: rgba(255, 255, 255, 0.06);
        }

        .login-footer .version {
            color: var(--white-dim);
            font-size: 0.65rem;
            margin-top: 10px;
            letter-spacing: 0.3px;
        }

        .powered-by {
            text-align: center;
            margin-top: 20px;
            position: relative;
            z-index: 1;
        }

        .powered-by .tech-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--white-dim);
            font-size: 0.6rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .powered-by .tech-badge:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .powered-by .tech-badge i {
            font-size: 0.7rem;
        }

        .powered-by .tech-badge .dot-blue { color: var(--blue); }
        .powered-by .tech-badge .dot-green { color: var(--green); }
        .powered-by .tech-badge .dot-orange { color: var(--orange); }

        .powered-by .tech-badge .dot {
            font-size: 0.3rem;
            color: var(--white-dim);
        }

        .powered-by .tech-badge strong {
            color: var(--white-muted);
            font-weight: 700;
        }

        /* ============================================
                   MODAL POPUP STYLES
               ============================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-content {
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 28px;
            padding: 40px 44px 36px;
            max-width: 440px;
            width: 92%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.8);
            position: relative;
            animation: slideUp 0.4s ease;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 29px;
            padding: 2px;
            background: conic-gradient(
                from 0deg,
                var(--blue),
                var(--green),
                var(--orange),
                var(--blue)
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.8;
        }

        .modal-content .modal-icon {
            text-align: center;
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .modal-content .modal-icon.error {
            color: #ff1744;
        }

        .modal-content .modal-icon.success {
            color: var(--green);
        }

        .modal-content .modal-icon.warning {
            color: var(--orange);
        }

        .modal-content .modal-icon.info {
            color: var(--blue);
        }

        .modal-content h2 {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 8px;
        }

        .modal-content .modal-message {
            text-align: center;
            color: var(--white-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .modal-content .modal-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-content .modal-btn.blue {
            background: linear-gradient(135deg, var(--blue), var(--blue-light));
            color: var(--white);
            box-shadow: 0 4px 25px var(--blue-glow);
        }

        .modal-content .modal-btn.blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px var(--blue-glow);
        }

        .modal-content .modal-btn.green {
            background: linear-gradient(135deg, var(--green), var(--green-light));
            color: var(--white);
            box-shadow: 0 4px 25px var(--green-glow);
        }

        .modal-content .modal-btn.green:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px var(--green-glow);
        }

        .modal-content .modal-btn.orange {
            background: linear-gradient(135deg, var(--orange), var(--orange-light));
            color: var(--white);
            box-shadow: 0 4px 25px var(--orange-glow);
        }

        .modal-content .modal-btn.orange:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px var(--orange-glow);
        }

        .modal-content .modal-btn.red {
            background: linear-gradient(135deg, #ff1744, #ff5252);
            color: var(--white);
            box-shadow: 0 4px 25px rgba(255, 23, 68, 0.3);
        }

        .modal-content .modal-btn.red:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(255, 23, 68, 0.4);
        }

        .modal-content .close-modal {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.5rem;
            color: var(--white-dim);
            cursor: pointer;
            transition: all 0.3s ease;
            background: none;
            border: none;
            line-height: 1;
        }

        .modal-content .close-modal:hover {
            color: var(--white);
            transform: rotate(90deg);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .login-card {
                padding: 36px 28px 32px;
                border-radius: 26px;
            }

            .login-brand .logo-wrapper {
                width: 72px;
                height: 72px;
                font-size: 2.2rem;
            }

            .login-brand h1 {
                font-size: 1.7rem;
            }

            .input-wrapper input {
                padding: 13px 14px 13px 12px;
                font-size: 0.9rem;
            }

            .btn-login {
                padding: 16px;
                font-size: 0.95rem;
            }

            .role-select-dropdown {
                padding: 13px 40px 13px 16px;
                font-size: 0.9rem;
            }

            .form-options {
                gap: 8px;
            }

            .login-footer .security-badge {
                gap: 8px;
            }

            .login-footer .security-badge .divider {
                display: none;
            }

            .modal-content {
                padding: 32px 24px 28px;
                border-radius: 24px;
            }

            .modal-content .modal-icon {
                font-size: 3rem;
            }

            .modal-content h2 {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 380px) {
            .login-card {
                padding: 28px 20px 24px;
                border-radius: 22px;
            }

            .login-brand .logo-wrapper {
                width: 62px;
                height: 62px;
                font-size: 1.8rem;
            }

            .login-brand h1 {
                font-size: 1.4rem;
            }

            .role-select-dropdown {
                padding: 11px 36px 11px 14px;
                font-size: 0.85rem;
            }

            .modal-content {
                padding: 24px 18px 22px;
                border-radius: 20px;
            }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(41, 121, 255, 0.3); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(41, 121, 255, 0.5); }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg-container">
        <div class="bg-gradient"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- ===== LOGIN ===== -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="accent-bar"></div>

            <!-- Brand -->
            <div class="login-brand">
                <div class="logo-wrapper">
                    <i class="fas fa-store-alt"></i>
                </div>
                <h1>
                    Mutomo Chain 
                    <span class="highlight-blue">Stores</span>
                </h1>
                <p class="tagline">
                    <i class="fas fa-shield-alt"></i> Secure Point of Sale System
                </p>
            </div>

            <!-- ============================================
                       DROPDOWN SELECT - ROLE
                   ============================================ -->
            <div class="role-dropdown-section">
                <label for="roleSelect">
                    <i class="fas fa-user-tag"></i> Select Role
                </label>
                <div class="role-select-wrapper">
                    <select class="role-select-dropdown" id="roleSelect">
                        <option value="admin">🛡️ Administrator</option>
                        <option value="sales">👔 Sales Person</option>
                    </select>
                </div>
            </div>

            <form id="loginForm" autocomplete="off">

                <!-- USERNAME -->
                <div class="form-group">
                    <label for="loginUsername">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" id="loginUsername" placeholder="Enter your username" autocomplete="off" required>
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="off" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- OPTIONS -->
                <div class="form-options">
                    <label class="option-item remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"><i class="fas fa-check"></i></span>
                        Remember me
                    </label>
                    <button type="button" class="option-item forgot-link" onclick="showForgotPassword()">
                        Forgot your password?
                    </button>
                </div>

                <!-- LOGIN BUTTON -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">Login</span>
                    <i class="fas fa-arrow-right btn-icon"></i>
                    <i class="fas fa-spinner spinner"></i>
                </button>
            </form>

            <!-- FOOTER -->
            <div class="login-footer">
                <div class="security-badge">
                    <span class="badge-item badge-blue">
                        <i class="fas fa-check-circle"></i> Secured connection
                    </span>
                    <span class="divider">|</span>
                    <span class="badge-item badge-green">
                        <i class="fas fa-lock"></i> Encrypted
                    </span>
                    <span class="divider">|</span>
                    <span class="badge-item badge-orange">
                        <i class="fas fa-shield-alt"></i> Protected
                    </span>
                </div>
                <div class="version">&copy; 2026 Mutomo Chain Stores</div>
            </div>
        </div>

        <div class="powered-by">
            <span class="tech-badge">
                <i class="fas fa-code dot-blue"></i>
                <span class="dot">•</span>
                Powered by <strong>AJ Tech</strong>
                <span class="dot">•</span>
                <i class="fas fa-fire dot-orange"></i>
                <span class="dot">•</span>
                <i class="fas fa-cloud dot-green"></i>
            </span>
        </div>
    </div>

    <!-- ============================================
               MODAL POPUP
           ============================================ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-modal" id="closeModalBtn">&times;</button>
            <div class="modal-icon" id="modalIcon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 id="modalTitle">Success!</h2>
            <p class="modal-message" id="modalMessage">Your action was completed successfully.</p>
            <button class="modal-btn blue" id="modalActionBtn">OK</button>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ============================================
            // MODAL FUNCTIONS
            // ============================================
            function showModal(icon, title, message, buttonText, buttonColor, callback) {
                const overlay = document.getElementById('modalOverlay');
                const iconEl = document.getElementById('modalIcon');
                const titleEl = document.getElementById('modalTitle');
                const messageEl = document.getElementById('modalMessage');
                const btnEl = document.getElementById('modalActionBtn');

                iconEl.innerHTML = `<i class="${icon}"></i>`;
                iconEl.className = 'modal-icon';

                titleEl.textContent = title;
                messageEl.textContent = message;

                btnEl.textContent = buttonText || 'OK';
                btnEl.className = 'modal-btn ' + (buttonColor || 'blue');

                overlay.classList.add('active');

                btnEl.onclick = function() {
                    overlay.classList.remove('active');
                    if (callback) callback();
                };

                document.getElementById('closeModalBtn').onclick = function() {
                    overlay.classList.remove('active');
                    if (callback) callback();
                };

                overlay.onclick = function(e) {
                    if (e.target === overlay) {
                        overlay.classList.remove('active');
                        if (callback) callback();
                    }
                };

                document.addEventListener('keydown', function handler(e) {
                    if (e.key === 'Escape' && overlay.classList.contains('active')) {
                        overlay.classList.remove('active');
                        document.removeEventListener('keydown', handler);
                        if (callback) callback();
                    }
                });
            }

            window.showErrorModal = function(title, message) {
                showModal(
                    'fas fa-times-circle error',
                    title || 'Error!',
                    message || 'Something went wrong. Please try again.',
                    'Try Again',
                    'red'
                );
            };

            window.showSuccessModal = function(title, message, callback) {
                showModal(
                    'fas fa-check-circle success',
                    title || 'Success!',
                    message || 'Operation completed successfully.',
                    'Continue',
                    'green',
                    callback
                );
            };

            window.showWarningModal = function(title, message, callback) {
                showModal(
                    'fas fa-exclamation-triangle warning',
                    title || 'Warning!',
                    message || 'Please review the information below.',
                    'Got It',
                    'orange',
                    callback
                );
            };

            window.showInfoModal = function(title, message, callback) {
                showModal(
                    'fas fa-info-circle info',
                    title || 'Information',
                    message || 'Here is some important information.',
                    'OK',
                    'blue',
                    callback
                );
            };

            // ============================================
            // LOGIN LOGIC
            // ============================================

            // Clear any existing session on load
            sessionStorage.removeItem('currentUser');

            const USERS = {
                'admin': { password: 'admin123', role: 'Admin', name: 'James' },
                'alice': { password: 'alice123', role: 'Admin', name: 'Alice' },
                'brian': { password: 'brian123', role: 'Sales', name: 'Brian' },
                'cathy': { password: 'cathy123', role: 'Sales', name: 'Cathy' }
            };

            // ============================================
            // GET SELECTED ROLE FROM DROPDOWN
            // ============================================
            const roleSelect = document.getElementById('roleSelect');
            let selectedRole = roleSelect.value;

            roleSelect.addEventListener('change', function() {
                selectedRole = this.value;
                console.log('📌 Role changed to:', selectedRole);
            });

            // ============================================
            // FORGOT PASSWORD
            // ============================================
            window.showForgotPassword = function() {
                showInfoModal(
                    '🔑 Reset Password',
                    'Please contact your system administrator to reset your password.\n\n📧 Email: admin@mutomochain.com\n📞 Phone: 0700 123 456'
                );
            };

            // ============================================
            // TOGGLE PASSWORD VISIBILITY
            // ============================================
            let passwordVisible = false;
            document.getElementById('togglePassword').addEventListener('click', function() {
                passwordVisible = !passwordVisible;
                const input = document.getElementById('loginPassword');
                input.type = passwordVisible ? 'text' : 'password';
                this.querySelector('i').className = passwordVisible ? 'fas fa-eye-slash' : 'fas fa-eye';
            });

            // ============================================
            // REMEMBER ME
            // ============================================
            const rememberMe = document.getElementById('rememberMe');
            const savedUsername = localStorage.getItem('mutomo_remember_username');
            if (savedUsername) {
                document.getElementById('loginUsername').value = savedUsername;
                rememberMe.checked = true;
            }

            // ============================================
            // FORM SUBMISSION
            // ============================================
            const loginForm = document.getElementById('loginForm');
            const loginUsername = document.getElementById('loginUsername');
            const loginPassword = document.getElementById('loginPassword');
            const loginBtn = document.getElementById('loginBtn');

            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = loginUsername.value.trim();
                const password = loginPassword.value.trim();

                // Validate fields
                if (!username) {
                    showErrorModal('⚠️ Missing Username', 'Please enter your username to continue.');
                    return;
                }

                if (!password) {
                    showErrorModal('⚠️ Missing Password', 'Please enter your password to continue.');
                    return;
                }

                if (password.length < 4) {
                    showErrorModal('⚠️ Password Too Short', 'Password must be at least 4 characters long.');
                    return;
                }

                // Show loading
                loginBtn.classList.add('loading');
                loginBtn.querySelector('.btn-text').textContent = 'Authenticating...';

                setTimeout(() => {
                    const user = USERS[username.toLowerCase()];

                    if (user && user.password === password) {
                        const userRole = user.role.toLowerCase();

                        // Check role match
                        if (userRole !== selectedRole) {
                            loginBtn.classList.remove('loading');
                            loginBtn.querySelector('.btn-text').textContent = 'Login';
                            showErrorModal(
                                '⛔ Role Mismatch',
                                `"${username}" is a ${user.role} account.\n\nPlease select "${user.role}" from the dropdown and try again.`
                            );
                            return;
                        }

                        // Save remember me
                        if (rememberMe.checked) {
                            localStorage.setItem('mutomo_remember_username', username);
                        } else {
                            localStorage.removeItem('mutomo_remember_username');
                        }

                        // Store session
                        sessionStorage.setItem('currentUser', JSON.stringify({ username, ...user }));

                        loginBtn.classList.remove('loading');
                        loginBtn.querySelector('.btn-text').textContent = 'Login';

                        // Show success modal then redirect
                        const redirectUrl = user.role === 'Admin' ? 'dashboard-admin.html' : 'dashboard-sales.html';
                        const roleDisplay = user.role === 'Admin' ? 'Admin' : 'Sales Person';

                        showSuccessModal(
                            '✅ Welcome ' + user.name + '!',
                            `You have successfully logged in as ${roleDisplay}.\n\nRedirecting to ${roleDisplay} Dashboard...`,
                            function() {
                                window.location.href = redirectUrl;
                            }
                        );

                    } else {
                        loginBtn.classList.remove('loading');
                        loginBtn.querySelector('.btn-text').textContent = 'Login';
                        showErrorModal(
                            '❌ Login Failed',
                            'Invalid username or password.\n\nPlease check your credentials and try again.'
                        );
                    }
                }, 800);
            });

            // ============================================
            // ENTER KEY SHORTCUTS
            // ============================================
            loginPassword.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
            });

            loginUsername.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') loginPassword.focus();
            });

            console.log('🔐 Login page loaded with dropdown and modal popups');
        })();
    </script>

</body>
</html>
